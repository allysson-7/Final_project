<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Fun Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">Welcome to Random Fun!</h1>
            <p id="subtitle">A landing page that's always surprising</p>
        </header>
        <main>
            <section class="hero">
                <button id="randomizeBtn">Click for Random Magic!</button>
                <div id="randomContent">
                    <p>Hover over me for a surprise!</p>
                </div>
            </section>
            <section class="features">
                <div class="feature" id="feature1">
                    <h2>Feature 1</h2>
                    <p>Random fact: Did you know?</p>
                </div>
                <div class="feature" id="feature2">
                    <h2>Feature 2</h2>
                    <p>Another random thing!</p>
                </div>
                <div class="feature" id="feature3">
                    <h2>Feature 3</h2>
                    <p>Something fun here!</p>
                </div>
            </section>
        </main>
        <footer>
            <p>&copy; 2026 Random Fun Inc. All rights reserved.</p>
        </footer>
    </div>
    <div class="particles" id="particles"></div>
    <script src="script.js"></script>
</body>
</html>
